name: Styler

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  styler:
    name: Styler
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # pak + P3M binaries + caching. `dependencies: hard` skips Suggests so
      # we don't install the irrelevant Suggests-closure system requirements.
      - name: Install styler
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::styler
          dependencies: '"hard"'

      # styler reformats in place; we then fail if anything changed, so the
      # job is a non-mutating "is the tree already styled?" check.
      - name: Check formatting with styler
        run: |
          Rscript -e 'styler::style_dir(".")'
          git diff --exit-code || {
            echo "::error::styler would reformat the above files. Run styler::style_dir() locally and commit."
            exit 1
          }
